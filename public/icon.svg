<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="labbench-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Code Symbol Metallic Gradient -->
    <linearGradient id="code-symbol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#labbench-bg)" />

  <!-- Outer Glass Overlay Line -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6" />

  <!-- Center Code Icon </ > -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 175 180 L 105 256 L 175 332" fill="none" stroke="url(#code-symbol)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M 285 160 L 227 352" fill="none" stroke="url(#code-symbol)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 337 180 L 407 256 L 337 332" fill="none" stroke="url(#code-symbol)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
